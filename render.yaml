databases:
  - name: chatwoot-db
    databaseName: chatwoot
    user: chatwoot
    plan: free

services:
  - type: redis
    name: chatwoot-redis
    plan: free

  - type: web
    name: chatwoot-web
    env: ruby
    plan: free
    buildCommand: bundle install && yarn install && bundle exec rake assets:precompile
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          property: connectionString
      - key: INSTALLATION_ENV
        value: render
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      - key: DEFAULT_LOCALE
        value: en

  - type: worker
    name: chatwoot-worker
    env: ruby
    plan: free
    buildCommand: bundle install && yarn install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: SECRET_KEY_BASE
        sync: chatwoot-web
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chatwoot-redis
          property: connectionString
      - key: INSTALLATION_ENV
        value: render
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      - key: DEFAULT_LOCALE
        value: en
